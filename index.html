  <script>
    /* Jalan sebelum React: pasang tema dan bahasa tersimpan agar tidak berkedip. */
    (function () {
      var root = document.documentElement;
      var theme = null, lang = null;
      try { theme = localStorage.getItem('theme'); lang = localStorage.getItem('lang'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      root.dataset.theme = theme;
      if (lang === 'id' || lang === 'en') root.lang = lang;
    })();
  </script>
